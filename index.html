<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0d1b2a">
<title>风的累积 · Wind Accumulation</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="风的累积">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
/* ============ WIND ACCUMULATION — surface-analysis instrument ============
   Release version lives in sw.js (const CACHE) — bump there on every release.
   Palette: atmospheric night base; convergence = warm bloom (air piling up),
            divergence = cool teal (air spreading). Wind ink = pale slate.
   Convergence is the subject, so it owns the only warm colour on the page. */
:root{
  --base:#0d1b2a; --panel:#14273b; --panel2:#1b344f;
  --ink:#e8eef4; --muted:#8ba3bd; --line:#24405c;
  --cvg1:#fde68a; --cvg2:#fb923c; --cvg3:#dc2626;   /* accumulation ramp */
  --div:#38bdf8;                                     /* dispersal */
  --accent:#f59e0b;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--base); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; overflow-x:hidden;
}
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 24px}

/* Header */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.title h1{font-size:22px;margin:0;letter-spacing:.5px;font-weight:800}
.title .sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:var(--mono);letter-spacing:.5px}
.title .cn{font-size:13px;color:var(--muted);margin-top:1px}
.langbtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.langbtn:active{transform:scale(.96)}

/* Controls row */
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn.geo{flex:1}
#refreshBtn,#goBtn{flex:0 0 116px;text-align:center}
.manualrow{display:flex;gap:8px;margin-bottom:6px}
.manualrow .latlon{flex:1;display:flex;gap:8px;min-width:0}
.manualrow input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:9px 11px;font-size:14px;font-family:var(--mono)}
.manualrow input::placeholder{color:var(--muted);font-family:var(--sans);font-size:12.5px}
.gpsinfo{font-size:11.5px;color:var(--muted);font-family:var(--mono);min-height:15px;margin-bottom:6px}
.gpsinfo.err{color:var(--warn)}
select,.btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:9px 12px;font-size:13.5px;font-family:var(--sans);cursor:pointer}
.btn{font-weight:700}
.btn.primary{background:var(--accent);color:#231400;border-color:var(--accent)}
.btn:active,select:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}

/* Map */
.mapwrap{position:relative}
.scrolltouch{position:absolute;top:84px;bottom:0;width:42px;z-index:600;cursor:pointer;touch-action:pan-y}
.scrolltouch.left{left:0;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,0));border-radius:0 0 0 14px}
.scrolltouch.right{right:0;background:linear-gradient(270deg,rgba(255,255,255,.05),rgba(255,255,255,0));border-radius:0 0 14px 0}
#map{height:min(64vh,660px);min-height:420px;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow);
  background:#0a1521;overflow:hidden;z-index:1}
.leaflet-container{background:#0a1521;font-family:var(--sans)}
.arrow{transition:transform .15s}
.arrow svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.focuspin{background:transparent!important;border:none!important;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}

/* Readout card */
.readout{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.readout .loc{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.focusfav{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--muted);
  border-radius:9px;width:34px;height:30px;font-size:16px;cursor:pointer;flex:none;line-height:1}
.focusfav.on{color:#ffb51a;border-color:rgba(255,181,26,.5);background:rgba(255,181,26,.12)}
.focusfav:active{transform:scale(.92)}
.gauge{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.gauge .val{font-size:38px;font-weight:800;font-family:var(--mono);line-height:1}
.gauge .unit{font-size:13px;color:var(--muted);font-family:var(--mono)}
.windwarn{margin-top:8px;padding:9px 12px;border-radius:10px;font-size:13.5px;font-weight:800;
  background:rgba(245,180,60,.16);border:1px solid rgba(245,180,60,.55);color:#ffcf7a}
.windwarn.severe{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.6);color:#fca5a5}
.cat{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;margin-top:4px}
.depthtag{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;margin:4px 0 0 6px;border:1px solid var(--line)}
.depthtag.deep{color:var(--ok);border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.10)}
.depthtag.shallow{color:var(--muted)}
.surgebadge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;margin:4px 0 0 6px;
  color:#dbeafe;background:rgba(56,189,248,.18);border:1px solid rgba(56,189,248,.55)}
.orobadge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;margin:4px 0 0 6px;
  color:#fde9c8;background:rgba(180,120,60,.20);border:1px solid rgba(180,120,60,.6)}
.verdict{margin-top:12px;padding:11px 13px;border-radius:11px;font-weight:800;font-size:15px;
  display:flex;align-items:center;gap:8px}
.verdict .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none;opacity:.9}
.ingredients{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.chip{flex:1;min-width:96px;border:1px solid var(--line);border-radius:10px;padding:8px 9px;
  background:var(--base);display:flex;flex-direction:column;gap:2px}
.chip .cname{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px}
.chip .cval{font-size:15px;font-weight:800;font-family:var(--mono)}
.chip .mk{margin-right:5px;font-weight:800}
.chip.on .mk{color:var(--warn)}
.chip.strong .mk{color:var(--bad)}
.chip.off .mk{color:var(--muted)}
.chip .tick{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.chip.on .tick{background:var(--warn)}
.chip.strong .tick{background:var(--bad);box-shadow:0 0 6px var(--bad)}
.chip.on .cval{color:var(--ink)}
.chip.off .cval{color:var(--muted)}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.meta b{color:var(--ink);font-weight:700}
.meta .mcat{font-weight:800;font-size:11px;margin-left:1px}
.confcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px;box-shadow:var(--shadow)}
.approachcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:12px;box-shadow:var(--shadow)}
.approachcard .aptitle{font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase;margin-bottom:7px}
.apmain{font-size:16px;font-weight:800}
.apmain.rain{color:#7dd3fc}
.apmain.dry{color:var(--muted);font-weight:700;font-size:14px}
.apmain .apsub{font-size:13px;color:var(--muted);font-weight:600}
.apsub2{font-size:13px;color:#cdd9e6;margin-top:4px}
.aprates{margin-top:6px;font-size:12.5px;font-family:var(--mono);color:#9db4cf;display:flex;flex-wrap:wrap;gap:9px;align-items:baseline}
.aprates .appk{color:#7dd3fc;font-weight:800}
.aprates .apunit{color:var(--muted);font-weight:700}
.apnote{font-size:11px;color:var(--muted);margin-top:8px;font-family:var(--mono);line-height:1.5}
.confcard .btn{font-size:13px;padding:8px 12px}
.confbody{margin-top:10px;font-size:13px}
.confbody:empty{display:none}
.confhead{font-weight:800;font-size:14px;margin-bottom:8px}
.confhead .cfsub{color:var(--muted);font-weight:600;font-size:12px;font-family:var(--mono)}
.confrow{display:flex;align-items:center;gap:8px;margin:5px 0}
.cflab{flex:0 0 64px;color:var(--muted);font-size:12px}
.cfbarwrap{flex:1;height:8px;background:var(--base);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.cfbar{display:block;height:100%;border-radius:6px;transition:width .3s}
.cfpct{flex:0 0 40px;text-align:right;font-family:var(--mono);font-size:12.5px}
.cfnote{color:var(--muted);font-size:11px;margin-top:8px;font-family:var(--mono);line-height:1.5}

/* Timeline */
.timeline{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px 12px 8px;margin-top:12px;box-shadow:var(--shadow)}
.timeline .tlhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.timeline .tlhead .lab{font-size:12px;color:var(--muted);font-family:var(--mono)}
.timeline .whenbig{font-size:14px;font-weight:700}
#spark{width:100%;height:70px;display:block;touch-action:none;cursor:pointer}
input[type=range]{width:100%;margin:8px 0 2px;accent-color:var(--accent)}

/* Legend */
.legend{display:flex;align-items:center;gap:4px;margin-top:9px;font-size:11.5px;color:#cdd9e6;font-family:var(--mono);flex-wrap:wrap}
.irrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.irbtn{font-size:12.5px;padding:7px 12px}
.irbtn.on{background:var(--accent);color:#231400;border-color:var(--accent)}
.isolabel{font-family:var(--mono);font-size:10.5px;font-weight:700;color:#d7c6f2;
  text-shadow:0 0 3px #0a1521,0 0 3px #0a1521,0 0 2px #0a1521;white-space:nowrap;pointer-events:none}
.irtime{font-size:12px;color:var(--muted);font-family:var(--mono)}
.irtime.irresume{color:var(--accent);cursor:pointer;font-weight:700}
.iropacity{flex:1;min-width:110px;accent-color:var(--accent)}
.seedmark,.favmark{display:flex!important;align-items:center;justify-content:center;line-height:1;
  background:transparent!important;border:none!important;box-shadow:none!important;cursor:pointer}
.seedmark{color:#ffd94d;font-size:12px;text-shadow:0 0 2px #000,0 0 1px #000}
.favmark{color:#ffb51a;font-size:20px;font-weight:900;text-shadow:0 0 4px #000,0 0 8px rgba(255,180,0,.55),0 1px 2px #000}
.locsheet{position:fixed;inset:0;z-index:1200;background:rgba(6,12,22,.55);display:none;align-items:flex-end;justify-content:center}
.locsheet.on{display:flex}
.locsheet-inner{background:var(--panel);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:82vh;
  display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.locsheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.locsheet-title{font-size:16px;font-weight:800}
.locsheet-x{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;width:32px;height:32px;font-size:14px;cursor:pointer}
.locsearch{width:100%;background:var(--base);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;font-family:var(--sans);margin-bottom:9px}
.locsave{width:100%;background:rgba(245,180,60,.14);border:1px solid rgba(245,180,60,.5);color:var(--accent);border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:9px}
.locsave:active{transform:scale(.99)}
.locbody{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.locgrouph{font-size:12.5px;font-weight:800;color:#cdd9e6;font-family:var(--mono);padding:11px 4px 9px;position:sticky;top:0;background:var(--panel);cursor:pointer;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
.locgrouph.static{cursor:default}
.locgrouph:active:not(.static){background:var(--panel2)}
.locgrouph .lgcaret{color:#8ba3bd;font-size:10px;width:10px;flex:none}
.locgrouph .lgname{flex:1;min-width:0}
.locgrouph .locn{color:var(--muted);font-weight:600;background:var(--base);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px}
.locrow{display:flex;gap:6px;align-items:stretch;margin-bottom:5px}
.locstar{flex:0 0 34px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:9px;font-size:15px;cursor:pointer}
.locstar.on{color:#ffd24d;border-color:rgba(255,210,77,.5)}
.locstar:active{transform:scale(.9)}
.locjump{flex:1;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;
  padding:9px 11px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.locjump:active{background:var(--accent);color:#231400}
.locjump.dim{opacity:.55}
.loccoord{font-size:11px;color:var(--muted);font-family:var(--mono)}
.locjump:active .loccoord{color:#231400}
.locedit,.locrestore{flex:0 0 38px;background:var(--panel2);border:1px solid var(--line);color:#9db4cf;border-radius:9px;font-size:13px;cursor:pointer}
.locdel{flex:0 0 38px;background:var(--panel2);border:1px solid var(--line);color:#f87171;border-radius:9px;font-size:13px;cursor:pointer}
.locpurge{width:100%;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:#f87171;border-radius:9px;padding:9px;font-size:12.5px;font-weight:700;cursor:pointer;margin:4px 0 8px}
.locempty{color:var(--muted);text-align:center;padding:24px;font-size:13px}
/* (#wtoast removed with the duplicate toast() it belonged to — .toast below is the live one) */
#wtoast-removed{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);background:#0d1a2c;border:1px solid var(--line);color:var(--ink);
  padding:9px 16px;border-radius:999px;font-size:13px;z-index:1400;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#wtoast-removed.show{opacity:1;transform:translateX(-50%) translateY(0)}
.legend .sw{width:26px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(255,255,255,.35);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.legend .grp{display:flex;align-items:center;gap:5px;margin-right:12px}

/* Explainer */
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
summary{padding:13px 14px;cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--muted)}
details[open] summary::after{content:"－"}
.exp{padding:0 14px 14px;font-size:13.5px;color:#cdd9e6}
.exp p{margin:8px 0}
.exp .warnbox{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);
  border-radius:10px;padding:10px 12px;color:#ffd98a;font-size:12.5px}
.exp code{font-family:var(--mono);background:#0a1521;padding:1px 5px;border-radius:4px;font-size:12px}
.qrbox{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px}
.qrbox svg{display:block;border-radius:8px;background:#fff;padding:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.qrcap{font-size:12px;color:var(--muted);text-align:center}
.qrlink{font-size:12px;color:var(--accent);text-decoration:none;font-family:var(--mono);word-break:break-all;text-align:center}
.qrlink:active{opacity:.6}

/* status / toast */
#status{text-align:center;font-size:12.5px;color:var(--muted);min-height:18px;margin-top:8px;font-family:var(--mono)}
.credit{text-align:center;font-size:11px;color:var(--muted);line-height:1.6;margin-top:6px;padding:0 4px}
.credit a{color:#9db4cf;text-decoration:none;border-bottom:1px dotted #46617f}
.credit a:active{opacity:.6}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:#233;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;pointer-events:none;
  transition:.25s;z-index:9999;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* footer action bar */
.actionbar{display:flex;gap:10px;justify-content:center;margin-top:16px;padding:0 0 calc(6px + env(safe-area-inset-bottom))}
.actionbar .btn{flex:1;max-width:none;text-align:center}
.wa{background:#25D366;color:#fff;border-color:#25D366;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px}
.wa .wa-logo{flex:none}
.wa-word{font-size:16px;letter-spacing:.2px}
.morn{background:var(--accent);color:#231400;border-color:var(--accent);font-weight:800}

/* overlay segmented toggle */
.seg{display:flex;gap:0;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.segbtn{flex:1;background:transparent;border:none;color:var(--muted);padding:9px 8px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:var(--sans)}
.segbtn.active{background:var(--panel2);color:var(--ink)}
.segbtn:active{transform:scale(.98)}

/* morning modal */
.modal{position:fixed;inset:0;background:rgba(5,10,18,.72);display:none;align-items:flex-end;justify-content:center;
  z-index:2000;backdrop-filter:blur(3px)}
.modal.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:820px;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.5);
  animation:rise .22s ease}
@keyframes rise{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;font-size:16px}
.xbtn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:2px 6px}
#shareText{width:100%;background:var(--base);color:var(--ink);border:1px solid var(--line);border-radius:12px;
  padding:12px;font-size:14.5px;line-height:1.6;font-family:var(--sans);resize:vertical}
.sheetbtns{display:flex;gap:10px;margin-top:12px}
.sheetbtns .btn{flex:1;text-align:center}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line);flex:0 0 auto;padding-left:16px;padding-right:16px}
.sheetnote{font-size:11.5px;color:var(--muted);margin-top:10px;font-family:var(--mono);text-align:center}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:480px){#map{height:min(62vh,600px);min-height:400px}.gauge .val{font-size:32px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1 id="t-title">风的累积</h1>
      <div class="sub" id="t-sub">雷暴 · 降雨 · 强风预警</div>
    </div>
    <button class="langbtn" id="langBtn" onclick="toggleLang()">🌐 中文</button>
  </header>

  <div class="controls">
    <button class="btn geo" id="geoBtn" onclick="useMyLocation()">📍 <span id="t-geo">当前位置</span></button>

/* ================= MALAYSIA STANDARD TIME =================================
   Every clock in this app reads MYT, whatever the device is set to and wherever
   the pin has been dropped. Two reasons, and the second is the important one:

   1. `timezone=auto` returned the FORECAST LOCATION's local time. Click across the
      Strait to Sumatra or north into Thailand and the rows silently became UTC+7,
      still labelled as if they were the reader's own hours.
   2. The forecast rows and the IR satellite clock were on DIFFERENT clocks. Rows
      came from naive strings parsed by the browser as device-local; the IR clock
      came from a real Date rendered with toLocaleTimeString, also device-local but
      of a genuine instant. Those two agree only when the device zone and the pin's
      zone are the same. One screen, two clocks, no label on either.

   Malaysia keeps UTC+8 all year and has no daylight saving, so a fixed offset is
   exact rather than an approximation — the same reasoning 风眼 TyphoonWatch uses in
   its myt() helper. The API is asked for Asia/Kuala_Lumpur, and the naive strings
   it returns are read with getUTC* after a "Z" is appended, which keeps the
   rendering independent of the device clock. ======================================= */
const TZ = 'Asia/Kuala_Lumpur';
const MYT_MS = 8*36e5;
// naive MYT string ("2026-08-07T15:00") -> the real instant it denotes
function mytMs(s){ const v=Date.parse(s+"Z"); return isFinite(v)?v-MYT_MS:NaN; }
// a real instant -> a Date whose getUTC* accessors read as MYT wall clock
function mytDate(ms){ return new Date(ms+MYT_MS); }
const p2 = x => String(x).padStart(2,'0');
// "15:00" from a naive MYT forecast stamp — no device zone involved
function mytHH(s){ return p2(new Date(Date.parse(s+"Z")).getUTCHours())+':00'; }
function mytHour(s){ return new Date(Date.parse(s+"Z")).getUTCHours(); }
// "15:40" from a real instant (used for the satellite frames)
function mytClock(ms){ const d=mytDate(ms); return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes()); }
// "2026-08-07" — the naive MYT stamp already carries the MYT calendar date
function mytDay(s){ return String(s).slice(0,10); }
function mytToday(){ return mytDate(Date.now()).toISOString().slice(0,10); }

function loadCenter(){
  try{ const c=JSON.parse(localStorage.getItem("wa_center")); if(c&&isFinite(c.lat)&&isFinite(c.lon)) return {lat:c.lat, lon:c.lon, name:null}; }catch(e){}
  return { lat:DEFAULT_CENTER.lat, lon:DEFAULT_CENTER.lon, name:null };
}
function saveCenter(){ try{ localStorage.setItem("wa_center", JSON.stringify({lat:center.lat, lon:center.lon})); }catch(e){} }
function syncFields(){
  document.getElementById('inLat').value = center.lat;
  document.getElementById('inLon').value = center.lon;
}

/* ================= LOCATIONS (seeds + favourites, full lifecycle) ================= */
/* fav record: {id, name, lat, lon, fav:bool, deleted:bool, seed:bool, updatedAt} */
let favs=(()=>{ try{return JSON.parse(localStorage.getItem('wa_favs'))||[]}catch(e){return[]} })();
const TRASH_PURGE_DAYS=30;
(function migrateAndPurge(){
  let changed=false; const cutoff=Date.now()-TRASH_PURGE_DAYS*86400000;
  favs.forEach(f=>{ if(f.id===undefined){f.id=newId();changed=true;} if(f.fav===undefined){f.fav=true;changed=true;}
    if(f.deleted===undefined){f.deleted=false;changed=true;} if(f.seed===undefined){f.seed=false;changed=true;}
    if(f.updatedAt===undefined){f.updatedAt=Date.now();changed=true;} });
  const before=favs.length; favs=favs.filter(f=>!(f.deleted && (f.updatedAt||0)<cutoff));
  if(changed||favs.length!==before) saveFavs();
})();
function newId(){ return 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function saveFavs(){ try{ localStorage.setItem('wa_favs', JSON.stringify(favs)); }catch(e){} }
function coordKey(lat,lon){ return (+lat).toFixed(3)+','+(+lon).toFixed(3); }
function recAt(lat,lon){ const k=coordKey(lat,lon); return favs.find(f=>coordKey(f.lat,f.lon)===k); }
function activeFavAt(lat,lon){ const f=recAt(lat,lon); return (f && !f.deleted && f.fav)?f:null; }

let seedLayer=null, showSeeds=(localStorage.getItem('wa_showseeds')!=='0');
function seedIcon(){ return L.divIcon({className:'seedmark', html:'★', iconSize:[22,22], iconAnchor:[11,11]}); }
function favIcon(){ return L.divIcon({className:'favmark', html:'★', iconSize:[26,26], iconAnchor:[13,13]}); }
function drawSeeds(){
  if(!map) return;
  if(!seedLayer){ seedLayer=L.layerGroup().addTo(map); }
  seedLayer.clearLayers();
  if(!showSeeds) return;
  SEED_LOCS.forEach(([lat,lon,name])=>{
    if(activeFavAt(lat,lon)) return;                 // shown as gold favourite instead
    L.marker([lat,lon],{icon:seedIcon(),keyboard:false,title:name})
      .on('click',()=>jumpTo(lat,lon,name)).addTo(seedLayer);
  });
  favs.filter(f=>f.fav && !f.deleted).forEach(f=>{
    L.marker([f.lat,f.lon],{icon:favIcon(),keyboard:false,title:f.name})
      .on('click',()=>jumpTo(f.lat,f.lon,f.name)).addTo(seedLayer);
  });
}
function toggleSeeds(){
  showSeeds=!showSeeds; localStorage.setItem('wa_showseeds', showSeeds?'1':'0');
  document.getElementById('seedBtn').classList.toggle('on', showSeeds);
  drawSeeds();
}
function jumpTo(lat,lon,name){
  center={lat:+(+lat).toFixed(4), lon:+(+lon).toFixed(4), name: name?{zh:name,en:name}:null};
  if(centerPin) centerPin.setLatLng([center.lat,center.lon]);
  syncFields(); saveCenter(); fitGrid();
  closeLocs();
  loadData();
}
function afterMut(){ saveFavs(); drawSeeds(); renderLocs(); updateFocusFav(); }
/* one-tap favourite for the location currently in focus */
function updateFocusFav(){
  const btn=document.getElementById('focusFav'); if(!btn) return;
  const on=!!activeFavAt(center.lat, center.lon);
  btn.textContent = on ? '★' : '☆';
  btn.classList.toggle('on', on);
  btn.title = on ? (lang==='zh'?'取消收藏':'Unfavourite') : (lang==='zh'?'设为我的农场':'Make this my farm');
}
function toggleFocusFav(){
  const ex=recAt(center.lat, center.lon);
  if(ex && !ex.deleted && ex.fav){                 // already a favourite → remove/unmark
    if(ex.seed) unstarRec(ex.id); else toggleFavFlag(ex.id);
    toast(lang==='zh'?'已取消收藏':'Removed from favourites');
    return;
  }
  const seed=SEED_LOCS.find(([lat,lon])=>coordKey(lat,lon)===coordKey(center.lat,center.lon));
  const name = seed ? seed[2] : (center.name?(lang==='zh'?center.name.zh:center.name.en):`${center.lat.toFixed(3)}, ${center.lon.toFixed(3)}`);
  if(ex){ ex.name=ex.name||name; ex.fav=true; ex.deleted=false; ex.updatedAt=Date.now(); }
  else favs.unshift({id:newId(),name,lat:+center.lat,lon:+center.lon,fav:true,deleted:false,seed:!!seed,updatedAt:Date.now()});
  afterMut();
  toast(lang==='zh'?'已设为我的农场 ★':'Saved as your farm ★');
}
/* ADD current spot */
function saveFav(){
  const ex=recAt(center.lat,center.lon);
  if(ex && !ex.deleted){ ex.fav=true; ex.updatedAt=Date.now(); afterMut(); toast(I18N[lang].locs.exists); return; }
  const dflt=center.name?(lang==='zh'?center.name.zh:center.name.en):`${center.lat.toFixed(3)}, ${center.lon.toFixed(3)}`;
  const nm=prompt(I18N[lang].locs.nameQ, dflt); if(nm===null) return;
  const name=(nm||'').trim() || `${center.lat.toFixed(3)}, ${center.lon.toFixed(3)}`;
  if(ex){ ex.name=name; ex.fav=true; ex.deleted=false; ex.updatedAt=Date.now(); }
  else favs.unshift({id:newId(),name,lat:+center.lat,lon:+center.lon,fav:true,deleted:false,seed:false,updatedAt:Date.now()});
  afterMut();
}
/* STAR / UNSTAR a seed */
function starSeed(lat,lon,name){
  const ex=recAt(lat,lon);
  if(ex){ ex.fav=true; ex.deleted=false; ex.updatedAt=Date.now(); }
  else favs.unshift({id:newId(),name,lat:+lat,lon:+lon,fav:true,deleted:false,seed:true,updatedAt:Date.now()});
  afterMut();
}
function unstarSeed(lat,lon){ const f=recAt(lat,lon); if(f){ favs=favs.filter(x=>x!==f); afterMut(); } }
function unstarRec(id){ favs=favs.filter(x=>x.id!==id); afterMut(); }   // seed favourite → revert to plain seed
/* MARK / UNMARK favourite (manual records: favourite ↔ saved, kept either way) */
function toggleFavFlag(id){ const f=favs.find(x=>x.id===id); if(!f)return; f.fav=!f.fav; f.updatedAt=Date.now(); afterMut(); }
/* RENAME */
function renameFav(id){ const f=favs.find(x=>x.id===id); if(!f)return; const nm=prompt(I18N[lang].locs.nameQ, f.name); if(nm===null)return; f.name=(nm||'').trim()||f.name; f.updatedAt=Date.now(); afterMut(); }
/* SOFT DELETE / RESTORE / PURGE (manual records only) */
function softDelete(id){ const f=favs.find(x=>x.id===id); if(!f)return; f.deleted=true; f.updatedAt=Date.now(); afterMut(); toast(I18N[lang].locs.trashed); }
function restoreFav(id){ const f=favs.find(x=>x.id===id); if(!f)return; f.deleted=false; f.updatedAt=Date.now(); afterMut(); }
function purgeFav(id){ if(!confirm(I18N[lang].locs.purge1Q))return; favs=favs.filter(x=>x.id!==id); afterMut(); }

    const g=region||L18.other; if(!groups.has(g)) groups.set(g,[]); groups.get(g).push([lat,lon,name]);
  });

    if(open) items.forEach(([lat,lon,name])=>{ const starred=!!activeFavAt(lat,lon);
      html+=`<div class="locrow">

function esc(s){return(s+'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

/* ================= DATA ================= */
function gridCoords(){
  // row 0 = northernmost; col 0 = westernmost
  const lats=[], lons=[], pts=[];
  const half=(GRID_N-1)/2;
  for(let i=0;i<GRID_N;i++){
    const la = +(center.lat + (half - i)*SPACING).toFixed(4);
    for(let j=0;j<GRID_N;j++){
      const lo = +(center.lon + (j - half)*SPACING).toFixed(4);
      lats.push(la); lons.push(lo); pts.push({i,j,lat:la,lon:lo});
    }
  }
  return {lats,lons,pts};
}

let inflight = null;
let elevCache = { sig:null, elev:null };
async function fetchElevation(lats, lons, signal){
  const sig = lats.join(',')+'|'+lons.join(',');
  if(elevCache.sig===sig && elevCache.elev) return elevCache.elev;
  const CH=100; const out=[];   // elevation API caps coordinates per request
  for(let s=0;s<lats.length;s+=CH){
    const la=lats.slice(s,s+CH), lo=lons.slice(s,s+CH);
    const url=`https://api.open-meteo.com/v1/elevation?latitude=${la.join(',')}&longitude=${lo.join(',')}`;
    const res=await fetch(url, {signal});
    if(!res.ok) throw new Error("elev HTTP "+res.status);
    const j=await res.json();
    const e=j.elevation || [];
    for(const v of e) out.push(v);
  }
  if(out.length===lats.length){ elevCache={sig, elev:out}; return out; }
  throw new Error("elev length mismatch "+out.length+"/"+lats.length);
}
async function loadData(){
  if(inflight){ try{ inflight.abort(); }catch(e){} }
  const ac = new AbortController(); inflight = ac;
  setStatus(true, I18N[lang].loading);
  document.getElementById('refreshBtn').disabled = true;
  const {lats,lons,pts} = gridCoords();
  // Winds/T/RH need pressure levels → IFS 0.25°. CAPE/precip are surface → sharper on IFS HRES 9km.
  // /v1/ecmwf serves best-per-variable automatically (9km surface + 0.25° upper-air).
  const vars = `wind_speed_925hPa,wind_direction_925hPa,wind_speed_850hPa,wind_direction_850hPa,`
    + `temperature_925hPa,relative_humidity_925hPa,cape,precipitation,wind_gusts_10m,pressure_msl`;
  const url = CAPE_HIRES
    ? `https://api.open-meteo.com/v1/ecmwf?latitude=${lats.join(',')}&longitude=${lons.join(',')}`
      + `&hourly=${vars}&wind_speed_unit=ms&timezone=${TZ}`
    : `https://api.open-meteo.com/v1/forecast?latitude=${lats.join(',')}&longitude=${lons.join(',')}`
      + `&hourly=${vars}&models=ecmwf_ifs025&forecast_days=3&wind_speed_unit=ms&timezone=${TZ}`;
  try{
    const res = await fetch(url, {signal:ac.signal});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const json = await res.json();
    const arr = Array.isArray(json) ? json : [json];   // multi-point returns array
    // Window: start 2h before now so it lines up with the ~40-min-delayed IR loop; 48 hourly slots
    const full = arr[0].hourly.time;
    const target = Date.now() - 2*3600*1000;
    let startIdx=0, bd=1e18;
    full.forEach((t,i)=>{ const d=Math.abs(mytMs(t)-target); if(d<bd){bd=d;startIdx=i;} });
    startIdx = Math.max(0, Math.min(startIdx, full.length - FORECAST_HOURS));
    const win = a => a ? a.slice(startIdx, startIdx+FORECAST_HOURS) : a;
    const time = win(full);
    const need = a=>{ if(!a) throw new Error("missing pressure-level field"); return win(a); };
    const grid = pts.map((p,k)=>{
      const h = arr[k].hourly;
      return { i:p.i, j:p.j, lat:p.lat, lon:p.lon,
        sp925:need(h.wind_speed_925hPa),  dr925:need(h.wind_direction_925hPa),
        sp850:need(h.wind_speed_850hPa),  dr850:need(h.wind_direction_850hPa),
        t925:need(h.temperature_925hPa),  rh925:need(h.relative_humidity_925hPa),
        cape:win(h.cape||[]),
        pr:win(h.precipitation||[]),
        mslp:win(h.pressure_msl||[]),
        gust:win(h.wind_gusts_10m||[]) };
    });
    // The forecast is requested in MYT and comes back as NAIVE local stamps. The isobar
    // grid spans 6° and would straddle +07/+08 under timezone=auto, so it is fetched in
    // GMT instead; keeping the offset here lets the two axes be matched on absolute time
    // rather than on string equality, whatever zone either side is expressed in.
    data = { time, grid, hours:time.length, tzOffset:(arr[0].utc_offset_seconds||0) };
    seriesCache=null;
    confShown=false; { const cb=document.getElementById('confBody'); if(cb) cb.innerHTML=''; }
    // snap slider to current hour
    hourIdx = nearestHourIndex(time);
    document.getElementById('hourSlider').max = time.length-1;
    document.getElementById('hourSlider').value = hourIdx;
    saveCache();
    render();
    setStatus(false, "");
    // Terrain (static Copernicus DEM 90 m) is an OPTIONAL enhancement, so it must not
    // hold up the first paint the way it used to — it is a second round-trip on every
    // location change. Fetch it after the map is already usable and re-render when it
    // lands; `mine` guards against a newer request having replaced `data` meanwhile.
    const mine = data;
    fetchElevation(lats, lons, ac.signal).then(elev=>{
      if(data!==mine) return;
      if(!elev || elev.length!==mine.grid.length) return;
      mine.grid.forEach((g,k)=>{ g.elev = elev[k]; });
      saveCache(); render();
    }).catch(()=>{ /* terrain optional — weather still works without it */ });
    if(isoOn) loadIsobars(ac.signal);   // background — the map is usable without it
    loadConfidence();   // background auto-load (cached per location)
  }catch(err){
    if(err && err.name==='AbortError') return;   // superseded by a newer request
    // fall back to cache — loud about it, never silent-stale
    const c = loadCache();
    if(c){
      const moved = Math.abs((c.center.lat||0)-center.lat)>1e-4
                 || Math.abs((c.center.lon||0)-center.lon)>1e-4;
      applyCache(c);
      let msg = "⚠ "+I18N[lang].offline+cacheAgeText(c);
      if(moved) msg += " · "+I18N[lang].offlineMoved
        .replace('{lat}', c.center.lat.toFixed(3)).replace('{lon}', c.center.lon.toFixed(3));
      setStatus(false, msg);
    }
    else setStatus(false, "⚠ "+I18N[lang].failed);
  }finally{
    if(inflight===ac) inflight=null;
    document.getElementById('refreshBtn').disabled = false;
  }
}

function loadCache(){
  try{ const c=JSON.parse(localStorage.getItem("wa_cache2")); return c&&c.data?c:null; }catch(e){ return null; }
}
function saveCache(){
  try{ localStorage.setItem("wa_cache2", JSON.stringify({center, data, at:Date.now()})); }catch(e){}
}
// How old the cached run is, in plain words. A cache with no age is worse than no
// cache: "showing last cached" without a time is a claim the reader cannot check.
function cacheAgeText(c){
  if(!c || !c.at) return "";
  const mins=Math.max(0, Math.round((Date.now()-c.at)/60000));
  const T=I18N[lang];
  if(mins<60) return " · "+T.cacheAgeMin.replace('{n}', mins);
  const hrs=Math.round(mins/60);
  if(hrs<48) return " · "+T.cacheAgeHr.replace('{n}', hrs);
  return " · "+T.cacheAgeDay.replace('{n}', Math.round(hrs/24));
}
// Move the ENTIRE view to the cached run — pin, input fields and map included — so the
// map and the numbers can never describe two different places.
function applyCache(c){
  center = { lat:c.center.lat, lon:c.center.lon, name:c.center.name||null };
  data = c.data;
  seriesCache=null; isoData=null; isoErr=null;
  hourIdx = Math.min(nearestHourIndex(data.time), data.hours-1);
  const sl=document.getElementById('hourSlider');
  if(sl){ sl.max=data.hours-1; sl.value=hourIdx; }
  if(centerPin) centerPin.setLatLng([center.lat, center.lon]);
  syncFields(); saveCenter();
  if(map){ isoOn ? map.fitBounds(isoBounds(),{padding:[16,16],animate:false}) : fitGrid(); }
  render();
}
function nearestHourIndex(times){
  const now=Date.now();
  let best=0,bd=1e18;
  times.forEach((t,i)=>{ const d=Math.abs(mytMs(t)-now); if(d<bd){bd=d;best=i;} });
  return best;
}

/* ================= PHYSICS: convergence ================= */
// meteorological dir = FROM direction. Component of motion (toward):
// u = -speed*sin(dir);  v = -speed*cos(dir)
function uv(speed, dirDeg){
  if(speed==null || dirDeg==null || !isFinite(speed) || !isFinite(dirDeg)) return { u:0, v:0 };
  const r = dirDeg*Math.PI/180;
  return { u:-speed*Math.sin(r), v:-speed*Math.cos(r) };
}
const ASCENT_DEPTH = 1500;   // m — boundary-layer depth for continuity-derived ascent
// grid spacing in metres at the current latitude
function gridDX(){ return SPACING*111320*Math.cos(center.lat*Math.PI/180); }
function gridDY(){ return SPACING*111320; }

// build GRID_N x GRID_N matrices of u,v at a pressure level for a given hour
function fields(hr, lvl){
  lvl = lvl || '925';
  const spK = lvl==='850'?'sp850':'sp925', drK = lvl==='850'?'dr850':'dr925';
  const U=[], V=[];
  for(let i=0;i<GRID_N;i++){ U.push(new Array(GRID_N)); V.push(new Array(GRID_N)); }
  data.grid.forEach(g=>{ const c=uv(g[spK][hr], g[drK][hr]); U[g.i][g.j]=c.u; V[g.i][g.j]=c.v; });
  return {U,V};
}
// horizontal convergence (s^-1) at interior points via central differences
function convergenceField(hr, lvl){
  const {U,V}=fields(hr, lvl);
  const dx=gridDX(), dy=gridDY();
  const C=[];
  for(let i=0;i<GRID_N;i++){ C.push(new Array(GRID_N).fill(null)); }
  for(let i=1;i<GRID_N-1;i++){
    for(let j=1;j<GRID_N-1;j++){
      const dudx = (U[i][j+1]-U[i][j-1])/(2*dx);
      const dvdy = (V[i-1][j]-V[i+1][j])/(2*dy);   // row i-1 = north
      C[i][j] = -(dudx + dvdy);   // convergence = -divergence
    }
  }
  return C;
}

// specific humidity (kg/kg) from RH(%), T(°C), pressure(hPa) — Tetens
function specHum(rh, tC, pHpa){
  if(rh==null || tC==null || !isFinite(rh) || !isFinite(tC)) return 0;
  const es = 6.112*Math.exp(17.67*tC/(tC+243.5));   // sat vapour pressure, hPa
  const e  = Math.max(0, rh/100)*es;                // actual vapour pressure
  const w  = 0.622*e/(pHpa - e);                    // mixing ratio kg/kg
  return w/(1+w);                                   // specific humidity kg/kg
}

// moisture-flux convergence at 925 hPa (g/kg per hour) = -∇·(qV)
function mfcField(hr){
  const Q=[],U=[],V=[];
  for(let i=0;i<GRID_N;i++){ Q.push(new Array(GRID_N)); U.push(new Array(GRID_N)); V.push(new Array(GRID_N)); }
  data.grid.forEach(g=>{
    Q[g.i][g.j]=specHum(g.rh925[hr], g.t925[hr], 925);
    const c=uv(g.sp925[hr], g.dr925[hr]); U[g.i][g.j]=c.u; V[g.i][g.j]=c.v;
  });
  const dx=gridDX(), dy=gridDY();
  const M=[];
  for(let i=0;i<GRID_N;i++){ M.push(new Array(GRID_N).fill(null)); }
  for(let i=1;i<GRID_N-1;i++){
    for(let j=1;j<GRID_N-1;j++){
      const dqdx=(Q[i][j+1]-Q[i][j-1])/(2*dx);
      const dqdy=(Q[i-1][j]-Q[i+1][j])/(2*dy);
      const dudx=(U[i][j+1]-U[i][j-1])/(2*dx);
      const dvdy=(V[i-1][j]-V[i+1][j])/(2*dy);
      const adv  = U[i][j]*dqdx + V[i][j]*dqdy;   // V·∇q  (kg/kg /s)
      const conv = Q[i][j]*(dudx+dvdy);           // q·∇·V
      M[i][j] = -(adv+conv)*1000*3600;            // → g/kg per hour
    }
  }
  return M;
}

// continuity-derived ascent (cm/s) from low-level convergence: w ≈ conv × depth
function ascentFromConv(cvg){ return cvg*ASCENT_DEPTH*100; }

// terrain elevation available?
function hasElevation(){ return !!(data && data.grid[0] && data.grid[0].elev!=null); }
// orographic ascent (cm/s) at centre: w_oro = V·∇z (air flowing toward rising terrain)
function oroAscent(hr){
  if(!hasElevation()) return null;
  const E=[]; for(let i=0;i<GRID_N;i++) E.push(new Array(GRID_N));
  data.grid.forEach(g=>{ E[g.i][g.j]=g.elev; });
  const i=CENTER, j=CENTER;
  if(E[i][j+1]==null||E[i][j-1]==null||E[i-1][j]==null||E[i+1][j]==null) return null;
  const dx=gridDX(), dy=gridDY();
  const dzdx=(E[i][j+1]-E[i][j-1])/(2*dx);
  const dzdy=(E[i-1][j]-E[i+1][j])/(2*dy);   // row i-1 = north
  const g=data.grid.find(x=>x.i===CENTER&&x.j===CENTER);
  const c=uv(g.sp925[hr], g.dr925[hr]);
  return (c.u*dzdx + c.v*dzdy)*100;           // m/s → cm/s
}
function categoryOf(c){
  const L=I18N[lang].cats;
  if(c<-TH.weak) return {k:'diverge', label:L.diverge, col:'var(--div)'};
  if(c< TH.weak) return {k:'calm',    label:L.calm,    col:'var(--muted)'};
  if(c< TH.mod)  return {k:'weak',    label:L.weak,    col:'var(--cvg1)'};
  if(c< TH.strong)return{k:'mod',     label:L.mod,     col:'var(--cvg2)'};
  return {k:'strong', label:L.strong, col:'var(--cvg3)'};
}
// Band qualifier for MFC (g/kg·h): negative = drying/diverging moisture
function categoryMFC(m){
  const B=I18N[lang].bands;
  if(m<=0)            return {label:B.dry,  col:'var(--div)'};
  if(m< MFC_TH.weak)  return {label:'',     col:'var(--muted)'};
  if(m< MFC_TH.mod)   return {label:B.weak, col:'var(--cvg1)'};
  if(m< MFC_TH.strong)return {label:B.mod,  col:'var(--cvg2)'};
  return {label:B.strong, col:'var(--cvg3)'};
}
// Band qualifier for derived ascent (cm/s): negative = sinking
function categoryAsc(a){
  const B=I18N[lang].bands;
  if(a<=0)             return {label:B.sink, col:'var(--div)'};
  if(a< ASC_TH.weak)   return {label:'',     col:'var(--muted)'};
  if(a< ASC_TH.mod)    return {label:B.weak, col:'var(--cvg1)'};
  if(a< ASC_TH.strong) return {label:B.mod,  col:'var(--cvg2)'};
  return {label:B.strong, col:'var(--cvg3)'};
}

/* Ingredients-based storm gating: lift (convergence) + moisture (RH) + instability (CAPE).
   Convergence alone is only a trigger; it fires a storm only if fuel + instability are present. */
/* Pure ingredient gate — usable per grid cell, not just the centre */
function gate(cvg, rh, cape){
  const liftOk  = cvg >= TH.weak;
  const moistOk = rh >= ING.rhOn;
  const instOk  = cape!=null && cape >= ING.capeOn;
  const liftStrong  = cvg >= TH.mod;
  const moistStrong = rh >= ING.rhStrong;
  const instStrong  = cape!=null && cape >= ING.capeStrong;
  const strong = (liftStrong?1:0)+(moistStrong?1:0)+(instStrong?1:0);
  let level; // 0 calm/diverge · 1 uplift-only · 2 incomplete · 3 watch · 4 likely
  if(!liftOk){ level = (cvg < -TH.weak)?-1:0; }
  else if(moistOk && instOk){ level = (liftStrong && strong>=2) ? 4 : 3; }
  else if(moistOk || instOk){ level = 2; }
  else { level = 1; }
  return { liftOk, moistOk, instOk, liftStrong, moistStrong, instStrong, level };
}

function stormIngredients(hr){
  const C = convergenceField(hr, '925');
  const cvg = C[CENTER][CENTER];                       // 925 hPa convergence (s^-1)
  const C8 = convergenceField(hr, '850');
  const cvg850 = C8[CENTER][CENTER];                   // 850 hPa convergence (s^-1)
  const M = mfcField(hr);
  const mfc = M[CENTER][CENTER];                        // moisture-flux convergence (g/kg/hr)
  const ascent = ascentFromConv(cvg);        // derived ascent (cm/s)
  const g = data.grid.find(x=>x.i===CENTER&&x.j===CENTER);
  const rh = g.rh925[hr];                     // 925 hPa relative humidity
  const cape = (g.cape&&g.cape[hr]!=null)?g.cape[hr]:null;
  const gg = gate(cvg, rh, cape);
  // convergence depth: deep = converging through 925 AND 850 (robust column)
  let depth = 'none';
  if(cvg >= TH.weak) depth = (cvg850 >= TH.weak) ? 'deep' : 'shallow';
  // monsoon surge: strong sustained 850 hPa flow from the N–E quadrant
  const sp8 = g.sp850[hr], dr8 = g.dr850[hr];
  const dirNE = (dr8!=null && isFinite(dr8)) && (dr8>=SURGE.dirMin || dr8<=SURGE.dirMax);
  const surge = (sp8!=null && isFinite(sp8) && sp8>=SURGE.spd && dirNE);
  // orographic (upslope) lift from terrain
  const oro = oroAscent(hr);                 // cm/s (null if no elevation)
  const upslope = (oro!=null && oro >= ORO_TH.on);
  const elev = g.elev!=null ? g.elev : null;
  return Object.assign({ cvg, cvg850, rh, cape, mfc, ascent, depth, surge, sp850:sp8, dr850:dr8,
                         oro, upslope, elev, capeUnknown: cape==null }, gg);
}
function verdictOf(level){
  const V = I18N[lang].verdict;
  switch(level){
    case 4: return {label:V.likely,  col:'var(--cvg3)', txt:'#fff'};
    case 3: return {label:V.watch,   col:'var(--cvg2)', txt:'#231400'};
    case 2: return {label:V.partial, col:'var(--cvg1)', txt:'#231400'};
    case 1: return {label:V.upliftOnly, col:'var(--panel2)', txt:'var(--ink)'};
    case -1:return {label:V.diverge, col:'var(--div)', txt:'#04202e'};
    default:return {label:V.calm,    col:'var(--panel2)', txt:'var(--muted)'};
  }
}
function alphaWarm(t){ return CELL_ALPHA.min + t*(CELL_ALPHA.max-CELL_ALPHA.min); }
function alphaCool(frac){ return 0.28 + 0.28*Math.min(1,frac); }   // diverging/low — visible, not dominant
function cellColor(c){
  if(c==null) return null;
  if(c<=0) return {fill:'#38bdf8', a:alphaCool(Math.abs(c)/CVG_RAMP_MAX)};
  const t=Math.min(1, c/CVG_RAMP_MAX);
  // ramp yellow->orange->red
  let col;
  if(t<0.5){ col=lerpCol([253,230,138],[251,146,60], t/0.5); }
  else{ col=lerpCol([251,146,60],[220,38,38],(t-0.5)/0.5); }
  return {fill:`rgb(${col[0]},${col[1]},${col[2]})`, a:alphaWarm(t)};
}
function lerpCol(a,b,t){ return a.map((v,i)=>Math.round(v+(b[i]-v)*t)); }
// CAPE instability ramp: teal -> green -> amber -> red across 0..3000 J/kg
function capeColor(cape){
  if(cape==null) return null;
  const t=Math.min(1, cape/3000);
  let col;
  if(t<0.33) col=lerpCol([56,189,248],[52,211,153], t/0.33);       // teal->green
  else if(t<0.66) col=lerpCol([52,211,153],[251,191,36],(t-0.33)/0.33); // green->amber
  else col=lerpCol([251,191,36],[220,38,38],(t-0.66)/0.34);        // amber->red
  return {fill:`rgb(${col[0]},${col[1]},${col[2]})`, a:alphaWarm(t)};
}

// MFC ramp (g/kg/hr): <=0 cool (drying/divergence), >0 warm across 0..MAX
function mfcColor(m){
  if(m==null) return null;
  if(m<=0) return {fill:'#38bdf8', a:alphaCool(Math.abs(m)/MFC_RAMP_MAX)};
  const t=Math.min(1, m/MFC_RAMP_MAX);
  let col = t<0.5 ? lerpCol([253,230,138],[251,146,60], t/0.5) : lerpCol([251,146,60],[220,38,38],(t-0.5)/0.5);
  return {fill:`rgb(${col[0]},${col[1]},${col[2]})`, a:alphaWarm(t)};
}

// Composite: colour a cell by its combined verdict level (ingredient overlap)
function comboColor(level){
  switch(level){
    case 4: return {fill:'#dc2626', a:0.78};   // storm likely
    case 3: return {fill:'#fb923c', a:0.66};   // watch
    case 2: return {fill:'#fde68a', a:0.52};   // incomplete
    case 1: return {fill:'#64748b', a:0.34};   // uplift only
    default: return null;                       // calm / diverging → clear
  }
}

// Terrain elevation ramp: green (low) -> tan -> brown (high)
function elevColor(e, emin, emax){
  if(e==null) return null;
  const t=Math.max(0,Math.min(1,(e-emin)/Math.max(1,emax-emin)));
  let col = t<0.5 ? lerpCol([34,120,66],[196,176,96], t/0.5) : lerpCol([196,176,96],[124,74,42],(t-0.5)/0.5);
  return {fill:`rgb(${col[0]},${col[1]},${col[2]})`, a:0.5};
}

/* ================= RENDER ================= */
function render(){
  if(!data) return;
  const hr = hourIdx;
  const C = convergenceField(hr);
  drawCells(C);
  drawIsobars();
  drawArrows(hr);
  drawReadout(C, hr);
  drawSpark();
  drawLegend();
  document.getElementById('readout').style.display='block';
  document.getElementById('timeline').style.display='block';
  document.getElementById('confCard').style.display='block';
  document.getElementById('approachCard').style.display='block';
  drawApproach();
  updateFocusFav();
  if(confShown) renderConfidence();
}

function drawCells(C){
  cellLayer.clearLayers();
  const half=SPACING/2, hr=hourIdx;
  // fast index → grid-point lookup
  const G=[]; for(let i=0;i<GRID_N;i++) G.push(new Array(GRID_N));
  data.grid.forEach(g=>{ G[g.i][g.j]=g; });
  const gAt=(i,j)=>G[i][j];

  if(overlayMode==='combo'){          // categorical — keep crisp cells
    const CC=convergenceField(hr,'925');
    for(let i=1;i<GRID_N-1;i++) for(let j=1;j<GRID_N-1;j++){
      const cvg=CC[i][j]; if(cvg==null) continue;
      const g=gAt(i,j);
      const cape=(g.cape&&g.cape[hr]!=null)?g.cape[hr]:null;
      const cc=comboColor(gate(cvg, g.rh925[hr], cape).level); if(!cc) continue;
      L.rectangle([[g.lat-half,g.lon-half],[g.lat+half,g.lon+half]],
        {stroke:false, fillColor:cc.fill, fillOpacity:cc.a, interactive:false}).addTo(cellLayer);
    }
    drawConvergenceAxis(CC, gAt);
    return;
  }
  if(overlayMode==='cape'){
    smoothField((i,j)=>{const g=gAt(i,j); return (g.cape&&g.cape[hr]!=null)?g.cape[hr]:null;}, capeColor, 0,GRID_N-1,0,GRID_N-1, gAt);
    return;
  }
  if(overlayMode==='mfc'){
    const M=mfcField(hr);
    smoothField((i,j)=>M[i][j], mfcColor, 1,GRID_N-2,1,GRID_N-2, gAt);
    return;
  }
  if(overlayMode==='terr'){
    if(!hasElevation()) return;
    const els=data.grid.map(g=>g.elev).filter(v=>v!=null);
    const emin=Math.min(...els), emax=Math.max(...els);
    smoothField((i,j)=>gAt(i,j).elev, e=>elevColor(e,emin,emax), 0,GRID_N-1,0,GRID_N-1, gAt);
    return;
  }
  if(overlayMode==='cvg850'){
    const C8=convergenceField(hr,'850');
    smoothField((i,j)=>C8[i][j], cellColor, 1,GRID_N-2,1,GRID_N-2, gAt);
    return;
  }
  smoothField((i,j)=>C[i][j], cellColor, 1,GRID_N-2,1,GRID_N-2, gAt);   // 925 convergence
  drawConvergenceAxis(C, gAt);
}

// Convergence axis: ridge of the convergence field (line of maximum convergence)
function drawConvergenceAxis(C, gAt){
  if(!C) return;
  const thr=TH.mod, N=GRID_N;
  const isRidge=(i,j)=>{
    const v=C[i][j]; if(v==null||v<thr) return false;
    const L=C[i][j-1], R=C[i][j+1], U=C[i-1][j], D=C[i+1][j];
    const hmax=(L==null||v>=L)&&(R==null||v>=R);   // crest across x
    const vmax=(U==null||v>=U)&&(D==null||v>=D);   // crest across y
    return hmax||vmax;
  };
  const mark={};
  for(let i=1;i<N-1;i++) for(let j=1;j<N-1;j++){ if(isRidge(i,j)) mark[i+'_'+j]=true; }
  const keys=Object.keys(mark); if(!keys.length) return;
  const segs=[];
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];   // connect to right/down neighbours (no dup)
  keys.forEach(k=>{
    const [i,j]=k.split('_').map(Number);
    dirs.forEach(([di,dj])=>{ if(mark[(i+di)+'_'+(j+dj)]){
      const a=gAt(i,j), b=gAt(i+di,j+dj); if(a&&b) segs.push([[a.lat,a.lon],[b.lat,b.lon]]); }});
  });
  // dark casing then bright line, so the axis reads on any background
  segs.forEach(s=>L.polyline(s,{color:'#0b1a30',weight:5,opacity:0.5,lineCap:'round',interactive:false}).addTo(cellLayer));
  segs.forEach(s=>L.polyline(s,{color:'#ffd27a',weight:2.6,opacity:0.98,lineCap:'round',interactive:false}).addTo(cellLayer));
  keys.forEach(k=>{ const [i,j]=k.split('_').map(Number); const g=gAt(i,j);
    L.circleMarker([g.lat,g.lon],{radius:2.8,weight:1,color:'#0b1a30',fillColor:'#ffd27a',fillOpacity:1,interactive:false}).addTo(cellLayer); });
}

// parse 'rgb(r,g,b)' or '#rrggbb' to [r,g,b]
function toRGB(s){
  if(s[0]==='#'){ const n=parseInt(s.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  const m=s.match(/\d+/g); return m?[+m[0],+m[1],+m[2]]:[0,0,0];
}
// render a continuous field as a bilinear-smoothed image overlay (browser upscales the point grid)
function smoothField(valAt, colorFn, i0,i1,j0,j1, gAt){
  const rows=i1-i0+1, cols=j1-j0+1;
  const cv=document.createElement('canvas'); cv.width=cols; cv.height=rows;
  const ctx=cv.getContext('2d'); const im=ctx.createImageData(cols,rows);
  for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++){
    const idx=((i-i0)*cols+(j-j0))*4;
    const v=valAt(i,j);
    const cc=(v==null||!isFinite(v))?null:colorFn(v);
    if(cc){ const c=toRGB(cc.fill); im.data[idx]=c[0]; im.data[idx+1]=c[1]; im.data[idx+2]=c[2]; im.data[idx+3]=Math.round((cc.a||0)*255); }
    else im.data[idx+3]=0;
  }
  ctx.putImageData(im,0,0);
  const h=SPACING/2;
  const nLat=gAt(i0,j0).lat+h, sLat=gAt(i1,j0).lat-h, wLon=gAt(i0,j0).lon-h, eLon=gAt(i0,j1).lon+h;
  L.imageOverlay(cv.toDataURL(), [[sLat,wLon],[nLat,eLon]], {opacity:1, interactive:false}).addTo(cellLayer);
}


/* ================= ISOBARS ==================================================
   Ported from 风眼 TyphoonWatch. Marching squares over the ECMWF mean-sea-level
   pressure field, drawn and nothing more: no low is named, no circulation is
   classified, no centre is marked. A closed contour off the coast is yours to
   read. Two things are worth holding in mind while reading it:

   1. Tropical pressure gradients are slack. A mid-latitude chart draws 4 hPa
      isobars; over Malaysia that gives you a blank map. This layer starts at
      1 hPa, drops to 0.5 or 0.25 when the field is flatter, and always prints
      the interval it chose. If even 0.25 hPa finds nothing it says so, rather
      than drawing a shape that is not there.
   2. The semidiurnal atmospheric tide swings tropical MSLP by roughly +-1.5 hPa
      twice a day, and across a 6 degree box it does so almost uniformly. So the
      LABELS breathe up and down through the day while the SHAPE of the field
      barely moves. Read the pattern and the spacing; do not read "1006 at 4pm,
      1008 at 10am" as a low filling in. ====================================== */

function isoCoords(){
  const half=(ISO.n-1)/2, lats=[], lons=[];
  for(let i=0;i<ISO.n;i++) for(let j=0;j<ISO.n;j++){
    lats.push(+(center.lat+(half-i)*ISO.spacing).toFixed(4));
    lons.push(+(center.lon+(j-half)*ISO.spacing).toFixed(4));
  }
  return {lats,lons};
}
function isoLat(i){ return center.lat + ((ISO.n-1)/2 - i)*ISO.spacing; }
function isoLon(j){ return center.lon + (j - (ISO.n-1)/2)*ISO.spacing; }
function isoBounds(){
  const d=((ISO.n-1)/2)*ISO.spacing;
  return [[center.lat-d, center.lon-d],[center.lat+d, center.lon+d]];
}

async function loadIsobars(signal){
  isoData=null; isoErr=null; isoBusy=true;
  drawIsobars(); drawLegend();
  try{
    const {lats,lons}=isoCoords();
    const CH=100, series=[]; let times=null;
    for(let s=0;s<lats.length;s+=CH){
      const la=lats.slice(s,s+CH), lo=lons.slice(s,s+CH);
      const url=`https://api.open-meteo.com/v1/ecmwf?latitude=${la.join(',')}&longitude=${lo.join(',')}`
        +`&hourly=pressure_msl&timezone=GMT&cell_selection=nearest`;
      const res=await fetch(url, signal?{signal}:{});
      if(!res.ok) throw new Error("HTTP "+res.status);
      const j=await res.json(), arr=Array.isArray(j)?j:[j];
      if(arr.length!==la.length) throw new Error("got "+arr.length+" of "+la.length+" points");
      arr.forEach(a=>{
        if(!a.hourly||!a.hourly.pressure_msl) throw new Error("no pressure_msl in response");
        if(!times) times=a.hourly.time;
        series.push(a.hourly.pressure_msl);
      });
    }
    if(!times||!times.length) throw new Error("empty time axis");
    // Match the two time axes on ABSOLUTE time. Main-grid stamps are local-naive,
    // isobar stamps are UTC; neither can be compared as a string.
    const isoMs=times.map(t=>Date.parse(t+"Z"));
    const off=(data.tzOffset||0)*1000, hmap={};
    data.time.forEach((t,hr)=>{
      const want=Date.parse(t+"Z")-off;
      let best=-1, bd=1e18;
      for(let k=0;k<isoMs.length;k++){ const d=Math.abs(isoMs[k]-want); if(d<bd){bd=d;best=k;} }
      if(bd<=45*60*1000) hmap[hr]=best;   // within half a step; otherwise leave the hour uncovered
    });
    isoData={ time:times, series, map:hmap };
  }catch(err){
    if(err && err.name==='AbortError'){ isoBusy=false; return; }
    isoErr=(err&&err.message)||"error";
  }
  isoBusy=false;
  drawIsobars(); drawLegend();
}

// Pressure values on the ISO grid for a main-grid hour, or null if that hour is uncovered.
function isoField(hr){
  if(!isoData) return null;
  const k=isoData.map[hr]; if(k==null) return null;
  const V=new Array(ISO.n*ISO.n);
  for(let p=0;p<V.length;p++){
    const s=isoData.series[p], v=s?s[k]:null;
    V[p]=(v==null||!isFinite(v))?NaN:v;
  }
  return V;
}

/* Choose the contour interval from the field's own range. Publishing the chosen
   interval (see isoLegendHTML) is the whole point — a contour spacing you cannot
   see is a claim you cannot check. */
function isoInterval(V){
  let lo=Infinity, hi=-Infinity, have=0;
  for(let k=0;k<V.length;k++){ const v=V[k]; if(isFinite(v)){ have++; if(v<lo)lo=v; if(v>hi)hi=v; } }
  if(!have) return null;
  const S=ISO.steps, count=x=>Math.floor(hi/x+1e-9)-Math.ceil(lo/x-1e-9)+1;
  let k=Math.max(0,S.indexOf(ISO.base));
  while(count(S[k])<ISO.minLines && k>0) k--;                  // too few lines → finer
  while(count(S[k])>ISO.maxLines && k<S.length-1) k++;         // too many → coarser
  const c=count(S[k]);
  return c>=1 ? {step:S[k], lo, hi, lines:c, have} : null;
}

// How much of the grid actually came back. A blank layer because half the points are
// missing is a different fact from a blank layer because the field is flat, and the
// legend must not report the second when it means the first.
function isoCoverage(V){
  let have=0; for(let k=0;k<V.length;k++) if(isFinite(V[k])) have++;
  return {have, total:V.length, missing:V.length-have};
}

// Marching squares, worked in lat/lon so Leaflet reprojects the result for free.
function isoContours(V){
  const sel=isoInterval(V); if(!sel) return null;
  const n=ISO.n, step=sel.step, out=[];
  const at=(i,j)=>V[i*n+j];
  const ip=(lv,p,q)=>(lv-p)/(q-p);
  // edge ids: 0 top, 1 right, 2 bottom, 3 left. 5 and 10 are the ambiguous
  // saddles, resolved the same way TyphoonWatch resolves them.
  const TABLE={1:[3,2],2:[2,1],3:[3,1],4:[0,1],5:[3,0,2,1],6:[0,2],7:[3,0],
               8:[3,0],9:[0,2],10:[3,2,0,1],11:[0,1],12:[3,1],13:[2,1],14:[3,2]};
  const first=Math.ceil(sel.lo/step-1e-9)*step;
  for(let lv=first; lv<=sel.hi+1e-9; lv+=step){
    const L0=+lv.toFixed(4), segs=[];
    for(let i=0;i<n-1;i++) for(let j=0;j<n-1;j++){
      const a=at(i,j), b=at(i,j+1), c=at(i+1,j+1), d=at(i+1,j);   // TL TR BR BL
      if(!isFinite(a)||!isFinite(b)||!isFinite(c)||!isFinite(d)) continue;
      const idx=(a>L0?8:0)|(b>L0?4:0)|(c>L0?2:0)|(d>L0?1:0);
      if(idx===0||idx===15) continue;
      const y0=isoLat(i), y1=isoLat(i+1), x0=isoLon(j), x1=isoLon(j+1);
      const E=[ [y0, x0+(x1-x0)*ip(L0,a,b)],
                [y0+(y1-y0)*ip(L0,b,c), x1],
                [y1, x0+(x1-x0)*ip(L0,d,c)],
                [y0+(y1-y0)*ip(L0,a,d), x0] ];
      const T=TABLE[idx];
      for(let k=0;k+1<T.length;k+=2) segs.push([E[T[k]],E[T[k+1]]]);
    }
    if(segs.length) out.push({lvl:L0, segs});
  }
  return out.length ? {step, levels:out, lo:sel.lo, hi:sel.hi} : null;
}

function isoFmt(v, step){ return v.toFixed(step>=1?0:(step>=0.5?1:2)); }

function drawIsobars(){
  if(!isoLayer) return;
  isoLayer.clearLayers(); isoLabelLayer.clearLayers();
  if(!isoOn || !data || !isoData) return;
  const V=isoField(hourIdx); if(!V) return;
  const C=isoContours(V); if(!C) return;

  /* Leaflet strokes in real screen pixels, so TyphoonWatch's 0.7 (which was 0.7
     viewBox units scaled up by mapScale) would vanish here. 1.15px over a dark
     casing carries the same intent: as fine as the screen will draw. At this box
     size adjacent contours sit hundreds of km apart, so the casing cannot fuse
     them — it only stops the line disappearing into a basemap place label. */
  C.levels.forEach(l=>{
    const paths=l.segs.map(s=>[[s[0][0],s[0][1]],[s[1][0],s[1][1]]]);
    L.polyline(paths,{pane:'isopane',color:ISO.casing,weight:ISO.casingWeight,
      opacity:0.5,lineCap:'round',interactive:false}).addTo(isoLayer);
    L.polyline(paths,{pane:'isopane',color:ISO.color,weight:ISO.weight,
      opacity:0.95,lineCap:'round',interactive:false}).addTo(isoLayer);
  });

  /* One value label per level. Where several levels crowd the same corner the
     later ones are DROPPED rather than stacked: a missing number is honest,
     overlapping digits are a wrong number. */
  const size=map.getSize(), placed=[], DX=5, DY=20, H=16;
  const free=(x,y,w)=>{
    if(x<6||y<6||x+w>size.x-6||y+H>size.y-6) return false;
    for(let i=0;i<placed.length;i++){
      const b=placed[i];
      if(x<b.x+b.w+10 && b.x<x+w+10 && y<b.y+H+4 && b.y<y+H+4) return false;
    }
    return true;
  };
  C.levels.slice().sort((a,b)=>b.lvl-a.lvl).forEach(l=>{
    const cands=l.segs.map(s=>s[0]).sort((a,b)=>b[1]-a[1]);   // east-most first
    const txt=isoFmt(l.lvl,C.step), w=txt.length*6.8;
    const stride=Math.max(1,Math.floor(cands.length/40));
    for(let i=0;i<cands.length;i+=stride){
      const pt=map.latLngToContainerPoint(L.latLng(cands[i][0],cands[i][1]));
      const x=pt.x+DX, y=pt.y-DY;
      if(!free(x,y,w)) continue;
      placed.push({x,y,w});
      L.marker([cands[i][0],cands[i][1]],{pane:'isopane',interactive:false,keyboard:false,
        icon:L.divIcon({className:'',html:'<div class="isolabel">'+txt+'</div>',
          iconSize:[w+8,H], iconAnchor:[-DX,DY]})}).addTo(isoLabelLayer);
      return;
    }
  });
}

/* ============ Rain-approach tracker ============ */
function compassName(bearing){
  const zh=['北','东北','东','东南','南','西南','西','西北'];
  const en=['N','NE','E','SE','S','SW','W','NW'];
  const k=Math.round(((bearing%360))/45)%8;
  return (lang==='zh'?zh:en)[k];
}
function computeApproach(hr){
  if(!data) return null;
  const cLat=center.lat, cLon=center.lon;
  const kmLat=111.32, kmLon=111.32*Math.cos(cLat*Math.PI/180);
  const dist=g=>Math.hypot((g.lon-cLon)*kmLon, (g.lat-cLat)*kmLat);
  const bearing=g=>{ let a=Math.atan2((g.lon-cLon)*Math.cos(cLat*Math.PI/180), (g.lat-cLat))*180/Math.PI; return (a+360)%360; };
  const wet=(g,h)=> g.pr && g.pr[h]!=null && g.pr[h]>=PR_MIN;
  const nearestRain=h=>{ let best=null,bd=1e9; data.grid.forEach(g=>{ if(wet(g,h)){ const d=dist(g); if(d<bd){bd=d;best=g;} } }); return best?{g:best,d:bd}:null; };
  const centerG=data.grid.find(x=>x.i===CENTER&&x.j===CENTER);
  const rainingHere = wet(centerG,hr);
  const near = nearestRain(hr);
  // ETA: first upcoming hour the centre cell turns wet
  let eta=null;
  for(let h=hr; h<data.hours; h++){ if(wet(centerG,h)){ eta=h; break; } }
  // trend: nearest-rain distance now vs a few hours ahead
  let trend=null;
  if(near){ const later=nearestRain(Math.min(hr+APPROACH_LOOK, data.hours-1));
    if(later) trend = later.d < near.d-3 ? 'approach' : (later.d > near.d+3 ? 'recede' : 'steady'); }
  // Wet spell: from the start of the current/upcoming event, walk forward tolerating short dry
  // gaps; end at the first sustained dry run. Flag whether it's on/off vs unbroken.
  let endsAt=null, intermittent=false;
  const startH = rainingHere ? hr : eta;
  if(startH!=null){
    const DRY_GAP=2;   // this many consecutive dry hours ends the spell
    let lastWet=startH, dry=0;
    for(let h=startH; h<data.hours; h++){
      if(wet(centerG,h)){ lastWet=h; dry=0; }
      else { dry++; if(dry>=DRY_GAP) break; }
    }
    endsAt = Math.min(lastWet+1, data.hours-1);
    for(let h=startH; h<lastWet; h++){ if(!wet(centerG,h)){ intermittent=true; break; } }
  }
  // hourly rain rates through the spell (wet hours only, so gaps show the on/off pattern)
  let wetHours=[], peak=0, peakIdx=null;
  if(startH!=null && endsAt!=null){
    for(let h=startH; h<=endsAt && h<data.hours; h++){
      const r=(centerG.pr && centerG.pr[h]!=null && isFinite(centerG.pr[h])) ? centerG.pr[h] : 0;
      if(r>=PR_MIN){ wetHours.push({h, r}); if(r>peak){ peak=r; peakIdx=h; } }
    }
    if(wetHours.length>12) wetHours=wetHours.slice(0,12);
  }
  return { rainingHere, near: near?{dist:near.d, bearing:bearing(near.g)}:null, eta, trend, endsAt, intermittent, wetHours, peak, peakIdx };
}
function rainLevel(r){ const R=I18N[lang].rlev;
  return r>=15?R.torr : r>=7.5?R.heavy : r>=2.5?R.mod : R.light; }
function drawApproach(){
  const el=document.getElementById('approachBody'); if(!el||!data) return;
  const nowIdx=nearestHourIndex(data.time);        // always "from now", independent of the slider
  const A=computeApproach(nowIdx), L=I18N[lang].appr;
  if(!A){ el.innerHTML=''; return; }
  const fmt=idx=>mytHH(data.time[idx]);
  const easing=()=>{ if(A.endsAt==null) return ''; const inN=A.endsAt-nowIdx;
    const lab = A.intermittent ? L.onoff : L.cont;
    return `<div class="apsub2">${lab} <b>${fmt(A.endsAt)}</b>${inN>0?` (${inN}${L.hAbbr})`:''}</div>`; };
  const rates=()=>{ if(!A.wetHours||!A.wetHours.length) return '';
    const items=A.wetHours.map(o=>{ const hh=fmt(o.h); const rr=o.r<1?o.r.toFixed(1):Math.round(o.r);
      const pk=(o.h===A.peakIdx)?' class="appk"':''; return `<span${pk}>${hh}·${rr}</span>`; }).join('');
    return `<div class="aprates">${items}<span class="apunit">mm/h · ${rainLevel(A.peak)}</span></div>`; };
  let html='';
  if(A.rainingHere){
    html+=`<div class="apmain rain">🌧 ${L.here}</div>`;
    html+=rates();
    html+=easing();
  } else if(A.eta!=null){
    const inN=A.eta-nowIdx;
    html+=`<div class="apmain rain">🌧 ${L.reaching} <b>${fmt(A.eta)}</b>${inN>0?` <span class="apsub">(${inN}${L.hAbbr})</span>`:''}</div>`;
    if(A.near) html+=`<div class="apsub2">${L.nearest}: ${Math.round(A.near.dist)} km ${compassName(A.near.bearing)}${A.trend?` · ${L[A.trend]}`:''}</div>`;
    html+=rates();
    html+=easing();
  } else if(A.near){
    html+=`<div class="apmain">${L.nearest}: <b>${Math.round(A.near.dist)} km ${compassName(A.near.bearing)}</b>${A.trend?` · ${L[A.trend]}`:''}</div>`;
    html+=`<div class="apsub2">${L.notReach}</div>`;
  } else {
    html+=`<div class="apmain dry">${L.none}</div>`;
  }
  html+=`<div class="apnote">${L.note}</div>`;
  el.innerHTML=html;
}

/* center-point convergence time series */
let seriesCache=null;
function centerSeries(){
  if(seriesCache) return seriesCache;
  const out=[];
  for(let h=0;h<data.hours;h++){ const ing=stormIngredients(h); out.push({v:ing.cvg, lvl:ing.level}); }
  seriesCache=out; return out;
}

function drawSpark(){
  const cv=document.getElementById('spark');
  const S=centerSeries(); const ser=S.map(o=>isFinite(o.v)?o.v:0);
  const W=cv.clientWidth||600, H=70, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; const x=cv.getContext('2d'); x.scale(dpr,dpr);
  x.clearRect(0,0,W,H);
  const absmax=ser.reduce((m,v)=>Math.max(m,Math.abs(v)),0);
  const mx=Math.max(0.5e-4, absmax);
  const mid=H*0.5;
  const px=i=>i/(ser.length-1)*(W-6)+3;
  const py=v=>mid - (v/mx)*(H*0.40);
  // storm-hour bands (behind everything): amber watch (lvl3), red likely (lvl4)
  const bw=(W-6)/(ser.length-1);
  S.forEach((o,i)=>{ if(o.lvl>=3){ x.fillStyle=o.lvl>=4?'rgba(220,38,38,.22)':'rgba(251,146,60,.16)';
    x.fillRect(px(i)-bw/2,0,bw,H); } });
  // zero line
  x.strokeStyle='#24405c'; x.lineWidth=1; x.beginPath(); x.moveTo(0,mid); x.lineTo(W,mid); x.stroke();
  // area
  x.beginPath(); x.moveTo(px(0),py(ser[0]));
  ser.forEach((v,i)=>x.lineTo(px(i),py(v)));
  x.lineTo(px(ser.length-1),mid); x.lineTo(px(0),mid); x.closePath();
  const grad=x.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(251,146,60,.5)'); grad.addColorStop(.5,'rgba(251,146,60,.05)');
  grad.addColorStop(1,'rgba(56,189,248,.25)');
  x.fillStyle=grad; x.fill();
  // line
  x.beginPath(); ser.forEach((v,i)=> i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v)));
  x.strokeStyle='#f59e0b'; x.lineWidth=2; x.stroke();
  // fire-risk dots along the top (tap targets)
  S.forEach((o,i)=>{ if(o.lvl>=3){ x.fillStyle=o.lvl>=4?'#dc2626':'#fb923c';
    x.beginPath(); x.arc(px(i),7,3.6,0,7); x.fill();
    x.strokeStyle='rgba(255,255,255,.5)'; x.lineWidth=1; x.stroke(); } });
  // current marker
  x.fillStyle='#fff'; x.beginPath(); x.arc(px(hourIdx),py(ser[hourIdx]),3.5,0,7); x.fill();
  x.strokeStyle='#f59e0b'; x.lineWidth=2; x.stroke();
}

/* ============ Himawari-9 IR loop (NASA GIBS) — 2-layer ping-pong ============ */
let irPanesReady=false, irOn=false, irFrames=[], irIdx=0, irTimer=null;
let irLyr={A:null,B:null}, irVis='A';
let irPaused=false, irBgStopped=false, irPlayStart=0;
let irOpacity=(()=>{ const v=parseFloat(localStorage.getItem('wa_iropacity')); return isFinite(v)?v:HIMAWARI.opacity; })();
function setIrOpacity(pct){
  irOpacity=Math.max(0.05, Math.min(1, pct/100));
  try{ localStorage.setItem('wa_iropacity', irOpacity); }catch(e){}
  if(irOn){ const p=map.getPane('irp'+irVis); if(p) p.style.opacity=irOpacity; }
}
function irTimeStr(d){
  const p=n=>String(n).padStart(2,'0');
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())
    +'T'+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':00Z';
}
function irUrlFor(d){
  return `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${HIMAWARI.layer}/default/${irTimeStr(d)}/${HIMAWARI.tms}/{z}/{y}/{x}.png`;
}
function irTimestamps(){
  const step=HIMAWARI.stepMin*60000;
  const end=Math.floor((Date.now()-HIMAWARI.latencyMin*60000)/step)*step;
  const out=[];
  for(let k=HIMAWARI.frames-1;k>=0;k--) out.push(new Date(end-k*step));
  return out;
}
function irUpdateTime(){
  const d=irFrames[irIdx]; if(!d) return;
  const hhmm=mytClock(d.getTime());
  document.getElementById('irTime').textContent = '🛰 '+hhmm+' '+I18N[lang].myt+(lang==='zh'?' 红外':' IR');
}
// only two panes ever — no stacked-layer texture eviction on iOS
function ensureIrPanes(){
  if(irPanesReady) return;
  ['A','B'].forEach((n,i)=>{
    const name='irp'+n;
    if(!map.getPane(name)) map.createPane(name);
    const p=map.getPane(name);
    p.style.zIndex=250+i; p.style.opacity=0; p.style.pointerEvents='none';
    p.style.transition='opacity '+HIMAWARI.fadeMs+'ms linear';
    p.style.filter='saturate(1.35) brightness(1.25)';   // lift keyed cold-top colours
  });
  irPanesReady=true;
}
// Tile layer that keys out the grey IR background on a canvas, keeping coloured cold tops
const IRTile = L.TileLayer.extend({
  createTile:function(coords, done){
    const size=this.getTileSize();
    const tile=document.createElement('canvas'); tile.width=size.x; tile.height=size.y;
    const img=new Image(); img.crossOrigin='anonymous';
    const url=this.getTileUrl(coords);
    img.onload=function(){
      const ctx=tile.getContext('2d');
      ctx.drawImage(img,0,0,size.x,size.y);
      try{
        const id=ctx.getImageData(0,0,size.x,size.y), d=id.data, lo=IR_SATMIN, hi=IR_SATFULL;
        for(let i=0;i<d.length;i+=4){
          const r=d[i],g=d[i+1],b=d[i+2];
          const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
          const sat = mx===0?0:(mx-mn)/mx;
          let a=(sat-lo)/(hi-lo); a=a<0?0:(a>1?1:a);
          d[i+3]=Math.round(d[i+3]*a);       // grey → transparent, colour → kept
        }
        ctx.putImageData(id,0,0);
      }catch(e){ /* CORS-tainted: leave tile unprocessed */ }
      done(null, tile);
    };
    img.onerror=function(){ done(null, tile); };   // missing tile → blank (basemap shows)
    img.src=url;
    return tile;
  }
});
function irMakeLayer(name){
  return new IRTile('', {maxNativeZoom:HIMAWARI.maxZoom, minZoom:0, pane:'irp'+name,
    crossOrigin:'anonymous', opacity:1, keepBuffer:4, updateWhenIdle:false});
}
// load `frame` into the hidden layer; reveal it only once fully loaded, then schedule the next
function irAdvance(nextIdx, isFirst){
  const hiddenName = isFirst ? irVis : (irVis==='A'?'B':'A');
  const hidden = irLyr[hiddenName];
  let loaded=false, waited=isFirst;
  const reveal=()=>{
    if(!irOn || irPaused || !(loaded && waited)) return;
    map.getPane('irp'+hiddenName).style.opacity = irOpacity;
    if(hiddenName!==irVis) map.getPane('irp'+irVis).style.opacity = 0;
    irVis=hiddenName; irIdx=nextIdx; irUpdateTime();
    if(Date.now()-irPlayStart > HIMAWARI.autostopMs){ irPause(); return; }   // battery/data auto-stop
    const hold = (irIdx===irFrames.length-1) ? HIMAWARI.holdMs : HIMAWARI.playMs;
    irTimer=setTimeout(()=>irAdvance((irIdx+1)%irFrames.length,false), hold);
  };
  hidden.off('load'); hidden.once('load', ()=>{ loaded=true; reveal(); });
  hidden.setUrl(irUrlFor(irFrames[nextIdx]));
  if(!isFirst) setTimeout(()=>{ waited=true; reveal(); }, 320);        // min display for current frame
  setTimeout(()=>{ if(!loaded){ loaded=true; reveal(); } }, 5000);     // fallback if load never fires
}
function irPause(){
  if(irTimer){ clearTimeout(irTimer); irTimer=null; }
  irPaused=true;
  const el=document.getElementById('irTime');
  if(el){ el.textContent = lang==='zh'?'⏸ 已暂停 · 点击播放':'⏸ paused · tap to play'; el.classList.add('irresume'); }
}
function irResume(){
  if(!irOn || !irPaused) return;
  irPaused=false; irPlayStart=Date.now();
  const el=document.getElementById('irTime'); if(el) el.classList.remove('irresume');
  irUpdateTime();
  irAdvance((irIdx+1)%irFrames.length, false);
}
// jump IR to a specific frame (random access) — used when scrubbing the outlook's past window
function irGoto(k){
  if(!irOn || k<0 || k>=irFrames.length) return;
  if(irTimer){ clearTimeout(irTimer); irTimer=null; }
  irPaused=true;                              // scrub takes manual control of IR
  const el=document.getElementById('irTime'); if(el) el.classList.add('irresume');
  const hiddenName = irVis==='A'?'B':'A', hidden = irLyr[hiddenName];
  let shown=false;
  const done=()=>{ if(shown||!irOn) return; shown=true;
    map.getPane('irp'+hiddenName).style.opacity=irOpacity;
    map.getPane('irp'+irVis).style.opacity=0;
    irVis=hiddenName; irIdx=k;
    const d=irFrames[irIdx], hhmm=mytClock(d.getTime());
    const el2=document.getElementById('irTime'); if(el2) el2.textContent='🛰 '+hhmm+' '+I18N[lang].myt+(lang==='zh'?' 红外·点击播放':' IR · tap to play');
  };
  hidden.off('load'); hidden.once('load', done);
  hidden.setUrl(irUrlFor(irFrames[k]));
  setTimeout(done, 2500);
}
function irFrameForTime(ms){
  let best=-1, bd=6*60000;   // within 6 min of a frame
  irFrames.forEach((d,i)=>{ const diff=Math.abs(d.getTime()-ms); if(diff<bd){ bd=diff; best=i; } });
  return best;
}
// when scrubbing the outlook into IR's ~2h past window, nudge IR to the matching frame
function syncIRToHour(){
  if(!irOn || !irFrames.length || !data) return;
  const t=mytMs(data.time[hourIdx]);
  const k=irFrameForTime(t);
  if(k>=0 && k!==irIdx) irGoto(k);
}
function toggleIR(){
  const btn=document.getElementById('irBtn');

  if(irOn){

      const p=map.getPane('irp'+n); if(p) p.style.opacity=0; });

  irLyr.A=irMakeLayer('A'); irLyr.A.addTo(map);

  if(arrowLayer) arrowLayer.clearLayers();  // hide arrows so IR is clear

}
