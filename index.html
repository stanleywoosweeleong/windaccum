/* ================= ECMWF ENSEMBLE CONFIDENCE ================= */
let ensData=null, ensSig=null, confShown=false;

/* Member keys are ENUMERATED from the response, never reconstructed. Open-Meteo
   names them zero-padded and starting at member00 — `base+'_member'+m` built
   `_member1`, which matches nothing, so every member but one silently dropped out
   and the panel reported a single member as if it were the ensemble. Reading the
   keys that are actually there also survives a member being absent from a run. */
function memberKeys(h, base){
  const re=new RegExp('^'+base+'_member\\d+$');
  const keys=Object.keys(h).filter(k=>re.test(k))
    .sort((a,b)=>(+a.match(/\d+$/)[0])-(+b.match(/\d+$/)[0]));
  if(!keys.length && Array.isArray(h[base])) return [base];   // deterministic single run
  return keys;
}

async function fetchEnsemble(){
  const sig=center.lat.toFixed(3)+','+center.lon.toFixed(3);
  if(ensSig===sig && ensData) return ensData;
  /* 925 hPa RH first, so the ensemble measures the SAME quantity the deterministic
     gate does. 2 m RH runs systematically higher in the tropics, so mixing the two
     made the confidence bar read optimistic against the verdict directly above it.
     2 m is still requested as a fallback, and the panel says which one it used. */
  const url=`https://ensemble-api.open-meteo.com/v1/ensemble`
    +`?latitude=${center.lat.toFixed(4)}&longitude=${center.lon.toFixed(4)}`
    +`&hourly=relative_humidity_925hPa,relative_humidity_2m,cape&models=${ENSEMBLE.model}`
    +`&forecast_days=3&timezone=${TZ}`;
  const res=await fetch(url); if(!res.ok) throw new Error("ens HTTP "+res.status);
  const json=await res.json();
  const h = Array.isArray(json) ? (json[0]&&json[0].hourly) : json.hourly;
  if(!h || !h.time) throw new Error("ensemble fields unavailable");
  let rhBase='relative_humidity_925hPa', rhKeys=memberKeys(h, rhBase);
  if(!rhKeys.length){ rhBase='relative_humidity_2m'; rhKeys=memberKeys(h, rhBase); }
  const capeKeys=memberKeys(h, 'cape');
  if(!rhKeys.length || !capeKeys.length) throw new Error("no ensemble members in response");
  /* THE HOUR AXIS. The ensemble series starts at 00:00 today; the main grid is a
     48-slot WINDOW starting about 2 h before now. Indexing the ensemble with the
     main grid's `hr` read roughly the current hour earlier in the day — plausible
     numbers about the wrong time. Both axes are the same location and therefore the
     same local zone, so absolute time matches them cleanly. */
  ensData={ hourly:h, rhBase, rhKeys, capeKeys, members:Math.min(rhKeys.length, capeKeys.length),
            time:h.time, map:null };
  ensSig=sig;
  return ensData;
}

// main-grid hour -> ensemble index, built once per (run, location) pair
function ensIndex(hr){
  if(!ensData || !data) return null;
  if(!ensData.map){
    const ms=ensData.time.map(t=>Date.parse(t+"Z")), m={};
    data.time.forEach((t,k)=>{
      const want=Date.parse(t+"Z");
      let best=-1, bd=1e18;
      for(let i=0;i<ms.length;i++){ const d=Math.abs(ms[i]-want); if(d<bd){bd=d;best=i;} }
      if(bd<=90*60*1000) m[k]=best;   // ECMWF ENS is 3-hourly at source; half a step
    });
    ensData.map=m;
  }
  const i=ensData.map[hr];
  return i==null?null:i;
}

// member agreement on the storm ENVIRONMENT (moisture + instability) at hour hr
function computeConfidence(hr){
  if(!ensData) return null;
  const i=ensIndex(hr);
  if(i==null) return { uncovered:true };
  const h=ensData.hourly, M=ensData.members;
  const val=(k)=>{ const a=h[k]; return (a&&a[i]!=null&&isFinite(a[i]))?a[i]:null; };
  let valid=0, fav=0, moistY=0, instY=0;
  for(let m=0;m<M;m++){
    const rh=val(ensData.rhKeys[m]), cape=val(ensData.capeKeys[m]);
    if(rh==null||cape==null) continue;
    valid++;
    const moist=rh>=ING.rhOn, inst=cape>=ING.capeOn;
    if(moist)moistY++; if(inst)instY++; if(moist&&inst)fav++;
  }
  if(!valid) return null;
  const p=(n)=>Math.round(n/valid*100);
  return { members:valid, offered:M, favorable:fav, pctFav:p(fav),
           pctMoist:p(moistY), pctInst:p(instY),
           rh925:ensData.rhBase==='relative_humidity_925hPa',
           when:ensData.time[i] };
}
function loadConfidence(){
  if(!data) return;
  const body=document.getElementById('confBody');
  body.innerHTML='<span class="spin"></span> '+(lang==='zh'?'读取集合…':'loading ensemble…');
  fetchEnsemble().then(()=>{ confShown=true; renderConfidence(); })
    .catch(e=>{ confShown=false; body.innerHTML='<span style="color:var(--warn)">'+(lang==='zh'?'集合数据不可用':'ensemble data unavailable')+' <span style="opacity:.7;font-size:11px">('+(e&&e.message?e.message:'error')+')</span></span>'; });
}
function renderConfidence(){
  if(!confShown || !ensData) return;
  const c=computeConfidence(hourIdx), body=document.getElementById('confBody'), V=I18N[lang].conf;
  if(c && c.uncovered){ body.innerHTML='<span style="color:var(--muted)">'+V.uncovered+'</span>'; return; }
  if(!c){ body.innerHTML='<span style="color:var(--muted)">'+(lang==='zh'?'无有效成员':'no valid members')+'</span>'; return; }
  const col=c.pctFav>=66?'var(--bad)':c.pctFav>=33?'var(--warn)':'var(--muted)';
  const bar=(lab,pct,bc)=>`<div class="confrow"><span class="cflab">${lab}</span><span class="cfbarwrap"><span class="cfbar" style="width:${pct}%;background:${bc}"></span></span><b class="cfpct">${pct}%</b></div>`;
  body.innerHTML =
    `<div class="confhead" style="color:${col}">${V.overall}: ${c.pctFav}% <span class="cfsub">(${c.favorable}/${c.members} ${V.members})</span></div>`
    + bar(V.moist, c.pctMoist, 'var(--div)')
    + bar(V.inst, c.pctInst, 'var(--cvg3)')
    + `<div class="cfnote">${c.rh925?V.note:V.note2m}</div>`;
}

/* ================= SHARE ================= */
// verdict label + count/reason suffix (shared by banner and share sheet)
function verdictText(ing){
  const v=verdictOf(ing.level);
  const S=I18N[lang].ingShort, N=I18N[lang].note;
  const n=(ing.liftOk?1:0)+(ing.moistOk?1:0)+(ing.instOk?1:0);
  const missing=[];
  if(!ing.liftOk)  missing.push(S.lift);
  if(!ing.moistOk) missing.push(S.moist);
  if(!ing.instOk)  missing.push(S.inst);
  let suffix="";
  if(ing.level>=1){
    const cnt=`(${n}/3)`;
    if(missing.length) suffix=` · ${lang==='zh'?missing.join('、')+S.short:S.short+' '+missing.join(', ')} ${cnt}`;
    else if(ing.level===4) suffix=` · ${N.all} ${cnt}`;
    else{ const r=!ing.liftStrong?N.weakLift:N.mod; suffix=` · ${N.present}${N.sep}${r} ${cnt}`; }
  }
  return {label:v.label, full:v.label+suffix, col:v.col, txt:v.txt};
}

// short phrase for today's daytime (06–21) storm window
function todayWindow(){
  const M=I18N[lang].morn;
  const today=mytToday();
  const marks=[];
  data.time.forEach((t,i)=>{
    const hr=mytHour(t);
    if(mytDay(t)===today && hr>=6 && hr<=21){
      const ing=stormIngredients(i); marks.push({h:hr, lvl:ing.level}); }
  });
  if(!marks.length) return M.nodata;
  const storm=marks.filter(m=>m.lvl>=3);
  const hh=x=>String(x).padStart(2,'0')+":00";
  if(storm.length){
    const s0=storm[0].h, s1=storm[storm.length-1].h;
    const peak=Math.max(...storm.map(m=>m.lvl));
    const win=s0===s1?hh(s0):`${hh(s0)}–${hh(s1)}`;
    return `${M.head} ${win} — ${peak>=4?M.likely:M.watch}`;
  }
  return marks.some(m=>m.lvl===1)?M.upliftOnly:M.lowrisk;
}

// full editable WhatsApp message: current reading + today's window
function shareRainText(){
  if(!data) return '';
  const nowIdx=nearestHourIndex(data.time);
  const A=computeApproach(nowIdx); if(!A) return '';
  const P=I18N[lang].appr;
  const fmt=idx=>mytHH(data.time[idx]);
  let head='';
  if(A.rainingHere) head=`🌧 ${P.here}`;
  else if(A.eta!=null){ const inN=A.eta-nowIdx; head=`🌧 ${P.reaching}${fmt(A.eta)}${inN>0?` (${inN}${P.hAbbr})`:''}`; }
  else return '';   // no rain reaching your point → nothing to broadcast
  let out='\n\n'+head;
  if(A.wetHours && A.wetHours.length){
    const items=A.wetHours.map(o=>{ const rr=o.r<1?o.r.toFixed(1):Math.round(o.r); return `${fmt(o.h)}·${rr}`; }).join(' ');
    out+=`\n${items} mm/h · ${rainLevel(A.peak)}`;
  }
  if(A.endsAt!=null){ const inN=A.endsAt-nowIdx; const lab=A.intermittent?P.onoff:P.cont;
    out+=`\n${lab}${fmt(A.endsAt)}${inN>0?` (${inN}${P.hAbbr})`:''}`; }
  return out;
}
function buildShareText(){
  const L=I18N[lang];
  const C=convergenceField(hourIdx);
  const cc=C[CENTER][CENTER]; const cat=categoryOf(cc);
  const g=data.grid.find(x=>x.i===CENTER&&x.j===CENTER);
  const ing=stormIngredients(hourIdx); const vt=verdictText(ing);
  const loc=center.name?(lang==='zh'?center.name.zh:center.name.en):`${center.lat.toFixed(3)},${center.lon.toFixed(3)}`;
  const val=(cc>0?'+':'')+(cc*1e5).toFixed(1)+"×10⁻⁵ s⁻¹";
  const capeTxt=ing.capeUnknown?"—":Math.round(ing.cape)+" J/kg";
  const mark=b=>b?"✅":"⬜";
  const md=mytToday();   // the date in Malaysia, not on whatever device is sharing
  const dd=md.slice(8,10), mmn=md.slice(5,7);
  const todayLab=(lang==='zh'?'今日':'Today')+` (${dd}/${mmn})`;
  const mfcTxt=(ing.mfc>0?'+':'')+ing.mfc.toFixed(1)+" g/kg·h";
  const ascTxt=(ing.ascent>0?'+':'')+ing.ascent.toFixed(0)+" cm/s";
  const depthTxt = ing.depth==='deep'?I18N[lang].depth.deep : ing.depth==='shallow'?I18N[lang].depth.shallow : '—';
  const surgeLine = ing.surge ? `\n🌊 ${I18N[lang].surge}: ${ing.sp850.toFixed(0)} m/s ${dirArrow(ing.dr850)}` : '';
  const oroLine = ing.upslope ? `\n🏔️ ${I18N[lang].upslope}: +${ing.oro.toFixed(0)} cm/s` : '';
  return `${L.waHead} · ${loc}
${L.waTime}: ${baseTimeLabel}

${vt.full}

${L.waConv}: ${val} (${cat.label}) · ${depthTxt}
${mark(ing.liftOk)} ${L.ing.lift}
${mark(ing.moistOk)} ${L.ing.moist}: ${Math.round(ing.rh)}%
${mark(ing.instOk)} ${L.ing.inst}: ${capeTxt}
${L.waMfc}: ${mfcTxt} · ${L.waAsc}: ${ascTxt}${surgeLine}${oroLine}
${L.waWind}: ${g.sp925[hourIdx].toFixed(1)} m/s ${dirArrow(g.dr925[hourIdx])}${shareRainText()}

${todayLab}: ${todayWindow()}

${L.waTip}`;
}

function openShare(){
  if(!data){ toast(lang==='zh'?"暂无数据":"No data yet"); return; }
  document.getElementById('shareText').value = buildShareText();
  document.getElementById('m-title').textContent = I18N[lang].shareTitle;
  document.getElementById('m-note').textContent = I18N[lang].shareNote;
  document.getElementById('shareModal').classList.add('show');
}
function closeShare(){ document.getElementById('shareModal').classList.remove('show'); }
function sendShare(){
  const t=document.getElementById('shareText').value;
  window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
  closeShare();
}

// `s` is a naive MYT stamp from the API. "Today" means today in Malaysia, not on the
// device, and the MYT tag is printed so the reader can check it.
function fmtTime(s){
  const days=lang==='zh'?['周日','周一','周二','周三','周四','周五','周六']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const d=new Date(Date.parse(s+"Z"));
  if(isNaN(d)) return "—";
  const sameDay = mytDay(s)===mytToday();
  return (sameDay?(lang==='zh'?'今天':'Today'):days[d.getUTCDay()])
    +" "+p2(d.getUTCHours())+":00 "+I18N[lang].myt;
}
function setStatus(spin,msg){
  document.getElementById('status').innerHTML = (spin?'<span class="spin"></span>':'')+(msg||'');
}
let toastT;
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2200); }

window.addEventListener('resize',()=>{ if(map){ map.invalidateSize(); } if(data) drawSpark(); });

/* ================= OFFLINE SHELL (inline SW) ================= */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  let hadController = !!navigator.serviceWorker.controller;
  let refreshing = false;
  // When a newly-deployed SW takes control, reload once to the fresh version.
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(refreshing) return;
    if(!hadController){ hadController = true; return; }   // ignore the first-ever install claim
    refreshing = true;
    window.location.reload();
  });
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    // Standalone PWAs may resume without navigating — check for updates on focus.
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='visible') reg.update().catch(()=>{});
    });
  }).catch(()=>{});
}

/* ================= BOOT ================= */
function setupSpark(){
  const cv=document.getElementById('spark');
  if(!cv) return;
  let dragging=false;
  const seek=clientX=>{
    if(!data) return;
    const rect=cv.getBoundingClientRect();
    const frac=Math.max(0,Math.min(1,(clientX-rect.left-3)/(rect.width-6)));
    const h=Math.round(frac*(data.hours-1));
    if(h!==hourIdx){ hourIdx=h; document.getElementById('hourSlider').value=hourIdx; render(); syncIRToHour(); }
  };
  cv.addEventListener('pointerdown',e=>{ dragging=true; try{cv.setPointerCapture(e.pointerId);}catch(x){} seek(e.clientX); e.preventDefault(); });
  cv.addEventListener('pointermove',e=>{ if(dragging) seek(e.clientX); });
  cv.addEventListener('pointerup',()=>{ dragging=false; });
  cv.addEventListener('pointercancel',()=>{ dragging=false; });
}

document.documentElement.lang = lang==='zh'?'zh':'en';
applyLang();
initMap();
if(isoOn) map.fitBounds(isoBounds(),{padding:[16,16],animate:false});
syncFields();
setupSpark();
// Pause the IR loop while the app is backgrounded (battery/data); resume on return.
document.addEventListener('visibilitychange', ()=>{
  if(!irOn) return;
  if(document.hidden){
    if(!irPaused && irTimer){ clearTimeout(irTimer); irTimer=null; irBgStopped=true; }
  } else if(irBgStopped && !irPaused){
    irBgStopped=false; irPlayStart=Date.now(); irAdvance((irIdx+1)%irFrames.length,false);
  }
});
// Paint the last cached run immediately, so a cold start on a bad connection shows
// something rather than an empty page; loadData() replaces it as soon as it answers.
{
  const cached=loadCache();
  if(cached){ applyCache(cached); setStatus(false, "⚠ "+I18N[lang].offline+cacheAgeText(cached)); }
}
loadData();
registerSW();
</script>
